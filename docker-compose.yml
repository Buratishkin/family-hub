services:
  db:
    image: postgres:16-alpine
    container_name: familyhub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: familyhub
      POSTGRES_USER: ${FAMILYHUB_POSTGRES_USER:?Set FAMILYHUB_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${FAMILYHUB_POSTGRES_PASSWORD:?Set FAMILYHUB_POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - familyhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  task-db:
    image: postgres:16-alpine
    container_name: familyhub-task-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskhub
      POSTGRES_USER: ${FAMILYHUB_POSTGRES_USER:?Set FAMILYHUB_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${FAMILYHUB_POSTGRES_PASSWORD:?Set FAMILYHUB_POSTGRES_PASSWORD in .env}
    ports:
      - "5434:5432"
    volumes:
      - familyhub_task_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  address-db:
    image: postgres:16-alpine
    container_name: familyhub-address-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: addresshub
      POSTGRES_USER: ${FAMILYHUB_POSTGRES_USER:?Set FAMILYHUB_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${FAMILYHUB_POSTGRES_PASSWORD:?Set FAMILYHUB_POSTGRES_PASSWORD in .env}
    ports:
      - "5435:5432"
    volumes:
      - familyhub_address_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  family-db:
    image: postgres:16-alpine
    container_name: familyhub-family-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: familyservice
      POSTGRES_USER: ${FAMILYHUB_POSTGRES_USER:?Set FAMILYHUB_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${FAMILYHUB_POSTGRES_PASSWORD:?Set FAMILYHUB_POSTGRES_PASSWORD in .env}
    ports:
      - "5436:5432"
    volumes:
      - familyhub_family_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:16-alpine
    container_name: familyhub-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: authhub
      POSTGRES_USER: ${FAMILYHUB_POSTGRES_USER:?Set FAMILYHUB_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${FAMILYHUB_POSTGRES_PASSWORD:?Set FAMILYHUB_POSTGRES_PASSWORD in .env}
    ports:
      - "5437:5432"
    volumes:
      - familyhub_auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  meal-db:
    image: postgres:16-alpine
    container_name: familyhub-meal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mealhub
      POSTGRES_USER: ${FAMILYHUB_POSTGRES_USER:?Set FAMILYHUB_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${FAMILYHUB_POSTGRES_PASSWORD:?Set FAMILYHUB_POSTGRES_PASSWORD in .env}
    ports:
      - "5438:5432"
    volumes:
      - familyhub_meal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:16-alpine
    container_name: familyhub-notification-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: notificationhub
      POSTGRES_USER: ${FAMILYHUB_POSTGRES_USER:?Set FAMILYHUB_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${FAMILYHUB_POSTGRES_PASSWORD:?Set FAMILYHUB_POSTGRES_PASSWORD in .env}
    ports:
      - "5439:5432"
    volumes:
      - familyhub_notification_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.1.1
    container_name: familyhub-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - familyhub_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  familyhub_postgres_data:
  familyhub_task_postgres_data:
  familyhub_address_postgres_data:
  familyhub_family_postgres_data:
  familyhub_auth_postgres_data:
  familyhub_meal_postgres_data:
  familyhub_notification_postgres_data:
  familyhub_kafka_data:
